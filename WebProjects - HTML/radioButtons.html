<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>

  <p>Do you prefer Star Wars or Star Trek?</p>

  <form>
    <label for="starWars">Star Wars:</label>
    <input name="geek" id="starWars" type="radio" value="STARWARS"/>

    <label for="starTrek">Star Trek:</label>
    <input name="geek" id="starTrek" type="radio" value="STARTREK"/>

    <p>What is your favorite color?</p>

    <select name="color">
      <option>Red</option>
      <option>Blue</option>
      <option>Yellow</option>
    </select>

    <p>What is your current mood?</p>

    <select name="mood">
      <option value="happy">:)</option>
      <option value="neutral">:|</option>
      <option value="sad">:(</option>
    </select>

    <textarea name="paragraph" rows="30" cols="75"></textarea>

    <button>Go!</button>
  </form>
  
</body>
</html>
