<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register</title>
  </head>
  <body>
    <h1>Register</h1>

    <form>
      <label for="firstName">First Name:</label>
      <input id="firstName" type="text" placeholder="John" required />

      <label for="lastName">Last Name</label>
      <input id="lastName" type="text" placeholder="Smith" required />

      <div>
        <label for="male">Male:</label>
        <input name="gender" id="male" type="radio" value="MALE" />

        <label for="female">Female:</label>
        <input name="gender" id="female" type="radio" value="FEMALE" />
      </div>
      <div>
        <label for="email">E-mail</label>
        <input id="email" type="email" placeholder="your e-mail" required />
          
        <label for="password">Password:</label>
        <input id="password" type="password" placeholder="your password" minlength="8" required/>
      </div>
      
      <legend>Birthday:</legend>
      <label for="month">Month:</label>
      <select name="month" id="month" required>
        <option>Month</option>
        <option value="january">Jan</option>
        <option value="february">Feb</option>
        <option value="march">Mar</option>
        <option value="april">Apr</option>
      </select>
        
      <label for="day">Day</label>
      <select name="day" id="day" required>
        <option>Day</option>
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3">3</option>
        <option value="4">4</option>
      </select>

      <label for="year">Year</label>
      <select name="year" id="year" required>
        <option>Year</option>
        <option value="2015">2015</option>
        <option value="2014">2014</option>
        <option value="2013">2013</option>
        <option value="2012">2012</option>
        <option value="2011">2011</option>
        <option value="2010">2010</option>
        </select>

      <div>
        <label for="agreed">I agree to the terms and conditions:</label>
        <input id="agreed" name="agreed" type="checkbox" required />
      </div>

      <button>Submit</button>
    </form>
  </body>
</html>
